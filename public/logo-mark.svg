<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 200" fill="none">
  <defs>

    <!-- J: cyan-to-blue gradient, top-to-bottom -->
    <linearGradient id="jGrad" x1="45" y1="20" x2="62" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#A8EDFF"/>
      <stop offset="35%"  stop-color="#00CFFF"/>
      <stop offset="100%" stop-color="#0096C7"/>
    </linearGradient>

    <!-- V: lavender-to-purple gradient -->
    <linearGradient id="vGrad" x1="95" y1="20" x2="162" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#D4AAFF"/>
      <stop offset="45%"  stop-color="#9B6EF3"/>
      <stop offset="100%" stop-color="#7547E8"/>
    </linearGradient>

    <!-- Soft glow for J -->
    <filter id="jGlow" x="-30%" y="-20%" width="160%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0
                0.7 0.9 1 0 0
                0 0.8 1 0 0
                0 0 0 0.6 0" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow for V -->
    <filter id="vGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0.4 0 0.6 0 0
                0 0 0.5 0 0
                0.8 0 1 0 0
                0 0 0 0.6 0" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- ══════════════
       J letterform
       Stroke-based: thick rounded strokes give the 3D ribbon look
       ══════════════ -->

  <!-- Top horizontal bar of J -->
  <line
    x1="80" y1="26"
    x2="32" y2="26"
    stroke="url(#jGrad)"
    stroke-width="22"
    stroke-linecap="round"
    filter="url(#jGlow)"
  />

  <!-- Vertical stem + curved hook at bottom -->
  <path
    d="M56 26 L56 148 Q56 175 40 180 Q23 183 18 167"
    stroke="url(#jGrad)"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    filter="url(#jGlow)"
  />

  <!-- ══════════════
       V letterform
       Two thick diagonal strokes meeting at a point
       ══════════════ -->
  <path
    d="M93 24 L130 170 L167 24"
    stroke="url(#vGrad)"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    filter="url(#vGlow)"
  />

  <!-- ══════════════
       Pixel dot accent — top right of V
       Matches the actual logo's tech pixel motif
       ══════════════ -->
  <!-- Row 1 -->
  <rect x="174" y="6"  width="13" height="13" rx="3"   fill="#00CFFF" opacity="0.95"/>
  <rect x="191" y="6"  width="10" height="10" rx="2.5" fill="#00CFFF" opacity="0.65"/>
  <rect x="205" y="6"  width="8"  height="8"  rx="2"   fill="#00CFFF" opacity="0.38"/>
  <!-- Row 2 -->
  <rect x="174" y="22" width="11" height="11" rx="2.5" fill="#9B6EF3" opacity="0.80"/>
  <rect x="189" y="22" width="9"  height="9"  rx="2"   fill="#7547E8" opacity="0.55"/>
  <!-- Row 3 -->
  <rect x="174" y="36" width="9"  height="9"  rx="2"   fill="#7547E8" opacity="0.35"/>
  <rect x="187" y="36" width="7"  height="7"  rx="1.5" fill="#7547E8" opacity="0.20"/>

</svg>
